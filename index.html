<!doctype html>
<!--
  VISUAL CONTRACT — PRE-DAWN COMMAND BRIDGE
  World: a naval operations station crossing from black night into cobalt dawn.
  Composition: horizontal horizon bands; the active tactical surface dominates.
  Type: condensed command lettering with precise, readable instrument text.
  Controls: tactile console keys, illuminated fields, explicit operational states.
  Motion: one atmospheric reveal, damped radar/targeting motion, reduced-motion safe.
-->
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07182c">
  <meta name="description" content="Batalha Naval online para duas pessoas, com salas privadas e partidas em tempo real.">
  <title>Batalha Naval</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v=20260805">
</head>
<body>
  <div class="sea-bg" aria-hidden="true"></div>

  <header class="topbar">
    <a class="brand" href="./" aria-label="Batalha Naval — página inicial">
      <span class="brand-mark">⚓</span>
      <span>
        <strong>Batalha Naval</strong>
        <small>Duelo online</small>
      </span>
    </a>
    <button id="soundButton" class="icon-button" type="button" aria-label="Ativar ou desativar sons" title="Sons">🔊</button>
  </header>

  <main id="app" class="app-shell" aria-live="polite">
    <section class="loading-card">
      <span class="spinner" aria-hidden="true"></span>
      <p>Preparando o oceano…</p>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <dialog id="confirmDialog" class="dialog">
    <form method="dialog">
      <h2 id="dialogTitle">Confirmar ação</h2>
      <p id="dialogText"></p>
      <div class="dialog-actions">
        <button class="button secondary" value="cancel">Cancelar</button>
        <button id="dialogConfirm" class="button danger" value="confirm">Confirmar</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="app.js?v=20260805"></script>
</body>
</html>
